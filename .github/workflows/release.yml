name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to package (for example, v0.13.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-linux:
    name: Package ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: source

      - name: Build package on Debian Bookworm
        env:
          RUST_BOOKWORM_IMAGE: docker.io/library/rust:1.89-bookworm@sha256:c9ac3fa8945b61dede1e4500d25028aa8fd8a8fe46365fcf9c0422f8d999b9b0
          TREE_RING_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e CARGO_HOME=/tmp/cargo \
            -e RUSTUP_HOME=/usr/local/rustup \
            -e TREE_RING_RELEASE_TAG \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/source \
            "$RUST_BOOKWORM_IMAGE" \
            sh -c 'sh ../scripts/package-release.sh'

      - name: Smoke-test package on Debian Bookworm
        env:
          DEBIAN_BOOKWORM_IMAGE: docker.io/library/debian:bookworm-slim@sha256:63a496b5d3b99214b39f5ed70eb71a61e590a77979c79cbee4faf991f8c0783e
        run: |
          linux_binary=$(
            find "$GITHUB_WORKSPACE/source/dist" \
              -path '*-linux-x86_64/tree-ring' \
              -type f \
              -print
          )
          test -n "$linux_binary"
          test "$(printf '%s\n' "$linux_binary" | wc -l)" -eq 1
          docker run --rm \
            --platform linux/amd64 \
            -v "$linux_binary:/tree-ring:ro" \
            "$DEBIAN_BOOKWORM_IMAGE" \
            /tree-ring --version

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tree-ring-memory-ubuntu-latest
          path: |
            source/dist/*.tar.gz
            source/dist/*.sha256

  package-macos:
    name: Package macos-latest
    runs-on: macos-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          path: source

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build package
        working-directory: source
        env:
          TREE_RING_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: sh ../scripts/package-release.sh

      - name: Smoke-test package
        working-directory: source
        run: |
          macos_binary=$(find dist -path '*-darwin-arm64/tree-ring' -type f -print)
          test -n "$macos_binary"
          test "$(printf '%s\n' "$macos_binary" | wc -l)" -eq 1
          test "$(uname -m)" = "arm64"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$("$macos_binary" --version)" = "tree-ring $version"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tree-ring-memory-macos-latest
          path: |
            source/dist/*.tar.gz
            source/dist/*.sha256

  publish-release:
    name: Publish GitHub release assets
    needs: [package-linux, package-macos]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: tree-ring-memory-*
          merge-multiple: true
          path: release-assets

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          test -n "$version"
          test "$RELEASE_TAG" = "v$version"
          for platform in darwin-arm64 linux-x86_64; do
            archive="release-assets/tree-ring-memory-$version-$platform.tar.gz"
            checksum="$archive.sha256"
            test -f "$archive"
            test -f "$checksum"
            expected=$(awk '{print $1}' "$checksum")
            actual=$(shasum -a 256 "$archive" | awk '{print $1}')
            test "$actual" = "$expected"
            for packaged_path in \
              "tree-ring-memory-$version-$platform/" \
              "tree-ring-memory-$version-$platform/tree-ring" \
              "tree-ring-memory-$version-$platform/README.md" \
              "tree-ring-memory-$version-$platform/LICENSE" \
              "tree-ring-memory-$version-$platform/install.sh"; do
              tar -tzf "$archive" | grep -F -x "$packaged_path" > /dev/null
            done
            entry_count=$(tar -tzf "$archive" | wc -l | tr -d '[:space:]')
            test "$entry_count" = "5"
          done

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/*.tar.gz release-assets/*.sha256 \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
